    <path d="M218 375l-24 32 44-12" fill="#f1e7d2" fill-opacity=".95"/>
    <path d="M250 305h100M250 329h76M250 353h48" stroke="#1d3b33" stroke-width="8" stroke-linecap="round" opacity=".62"/>
